name: 나라장터 공고 갱신 및 사이트 배포

on:
  workflow_dispatch:
  schedule:
    # 한국시간 매일 00:17, 06:17, 12:17, 18:17
    - cron: '17 3,9,15,21 * * *'

concurrency:
  group: g2b-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r requirements-collector.txt
      - name: Prepare static website files
        run: |
          mkdir -p _site
          cp site/index.html site/styles.css site/*.js _site/
      - name: Collect public bid notices
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python collect_bids.py _site/data/bids.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
