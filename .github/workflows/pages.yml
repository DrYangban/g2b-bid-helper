name: 나라장터 공고 갱신 및 사이트 배포

on:
  workflow_dispatch:
    inputs:
      fresh_requirements:
        description: 이전 요건 결과를 재사용하지 않고 표본을 다시 읽기
        type: boolean
        default: false
  schedule:
    # 한국시간 매일 00:17, 06:17, 12:17, 18:17
    - cron: '17 3,9,15,21 * * *'

concurrency:
  group: g2b-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r requirements-collector.txt
      - name: Prepare static website files
        run: |
          mkdir -p _site
          cp site/index.html site/styles.css site/*.js _site/
      - name: Prepare browser document readers
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/g2b-preview" --ignore-scripts --omit=optional --no-audit --no-fund pdfjs-dist@6.5.438 cfb@1.2.2
          packages="$RUNNER_TEMP/g2b-preview/node_modules"
          mkdir -p _site/vendor/pdfjs _site/vendor/cfb
          cp "$packages/pdfjs-dist/LICENSE" "$packages/pdfjs-dist/build/pdf.min.mjs" "$packages/pdfjs-dist/build/pdf.worker.min.mjs" _site/vendor/pdfjs/
          cp -R "$packages/pdfjs-dist/cmaps" "$packages/pdfjs-dist/standard_fonts" _site/vendor/pdfjs/
          cp "$packages/cfb/LICENSE" "$packages/cfb/dist/cfb.min.js" _site/vendor/cfb/
      - name: Prepare browser Python rules
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/g2b-rules" --ignore-scripts --omit=optional --no-audit --no-fund pyodide@314.0.8
          runtime="$RUNNER_TEMP/g2b-rules/node_modules/pyodide"
          mkdir -p _site/vendor/pyodide-314.0.8
          cp "$runtime/pyodide.mjs" "$runtime/pyodide.asm.mjs" "$runtime/pyodide.asm.wasm" \
            "$runtime/pyodide-lock.json" "$runtime/python_stdlib.zip" "$runtime/README.md" _site/vendor/pyodide-314.0.8/
          cp requirement_rules.py _site/
      - name: Collect public bid notices
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python collect_bids.py _site/data/bids.json
      - name: Install attachment extraction dependencies
        continue-on-error: true
        run: python -m pip install -r requirements-attachments.txt
      - name: Collect public attachment metadata
        continue-on-error: true
        timeout-minutes: 5
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python collect_attachments.py _site/data/bids.json _site/data/attachments.json
      - name: Test attachment and requirement rules
        run: python -m unittest test_attachments test_requirements
      - name: Prepare public requirement findings
        continue-on-error: true
        timeout-minutes: 4
        env:
          FRESH_REQUIREMENTS: ${{ inputs.fresh_requirements || false }}
        run: |
          options=()
          if [ "$FRESH_REQUIREMENTS" = true ]; then options+=(--fresh); fi
          python collect_requirements.py _site/data/bids.json _site/data/attachments.json _site/data/requirements.json "${options[@]}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
